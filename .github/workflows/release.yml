# Builds the Windows desktop installer and publishes the GitHub release.
#
# The image is built separately by docker.yml - both trigger on the same tag,
# run in parallel, and neither waits on the other. The release notes point at
# the image; the image does not need the release to exist.
#
# The whole reason this file is longer than it looks like it should be: the
# three binaries the installer bundles (ffmpeg, ffprobe, qjs) are gitignored,
# because they are ~230 MB and platform-specific. `scripts/build-service.mjs`
# refuses to build without them - correctly, since their absence produces an
# installer that works on the build machine and fails every merge on a clean
# install. So CI has to fetch its own, from the sources named in
# service/vendor/README.md.

name: release

on:
  push:
    tags: ["v*"]
  # So the build can be exercised without cutting a tag. Produces artefacts on
  # the run, and no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # A cold Rust build of a Tauri app is the slowest step here by a wide
      # margin. Keyed on the lockfile so it survives everything except a real
      # dependency change.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # --- the vendored binaries ------------------------------------------
      #
      # gyan.dev's "release-essentials" build is what service/vendor/README.md
      # names, and its zip needs no 7-Zip. Only ffmpeg.exe and ffprobe.exe are
      # taken; ffplay is ignored.
      #
      # ffprobe must keep its plain name and sit beside ffmpeg - yt-dlp derives
      # its location from ffmpeg's directory, and a renamed or relocated
      # ffprobe breaks every merge while still reporting as available.
      - name: Fetch ffmpeg and ffprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted -Force

          $dest = "service/vendor/ffmpeg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $found = Get-ChildItem -Path ffmpeg-extracted -Filter $name -Recurse |
                     Select-Object -First 1
            if (-not $found) { throw "$name not found in the archive" }
            Copy-Item $found.FullName (Join-Path $dest $name) -Force
            Write-Host "  $name  $([math]::Round($found.Length/1MB,1)) MB"
          }

      # quickjs-ng, not Bellard's QuickJS - it is the fork yt-dlp targets and
      # the one that ships prebuilt binaries. Resolved through the API rather
      # than a hardcoded URL so a new release does not silently break this.
      #
      # Not optional despite being 2 MB: without a JS runtime, YouTube
      # extraction degrades *silently* - adaptive formats vanish and you get a
      # working-looking app that can only fetch low-quality muxed streams.
      - name: Fetch quickjs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            "User-Agent"    = "inferno-app-release"
          }
          $release = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/quickjs-ng/quickjs/releases/latest"
          Write-Host "quickjs-ng $($release.tag_name)"

          # Exact name, not a wildcard: qjsc-* (the compiler) and the x86
          # 32-bit build sit right beside it, and either would produce a
          # confusing runtime failure rather than an obvious one.
          $asset = $release.assets |
                   Where-Object { $_.name -eq "qjs-windows-x86_64.exe" } |
                   Select-Object -First 1
          if (-not $asset) {
            Write-Host "Assets present in this release:"
            $release.assets | ForEach-Object { Write-Host "  $($_.name)" }
            throw "qjs-windows-x86_64.exe not found - the asset naming changed"
          }

          $dest = "service/vendor/js"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Renamed to qjs.exe, which is the name the resolver looks for.
          Invoke-WebRequest -Uri $asset.browser_download_url `
                            -OutFile (Join-Path $dest "qjs.exe") -UseBasicParsing
          Write-Host "  qjs.exe from $($asset.name)"

      # --- the build ------------------------------------------------------
      #
      # `scripts/build-service.mjs` expects an interpreter at exactly this
      # path, so a venv it is rather than the runner's global Python.
      - name: Create the service virtualenv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv service/.venv
          service/.venv/Scripts/python.exe -m pip install --upgrade pip
          service/.venv/Scripts/pip.exe install -e "service[dev]" pyinstaller

      - name: Install npm dependencies
        run: npm ci

      # Fails loudly if any of the three did not land where it belongs, before
      # spending thirty minutes on a Rust build that would produce a broken
      # installer.
      - name: Verify the binaries resolve
        shell: pwsh
        env:
          FFMPEG_DIR: ${{ github.workspace }}\service\vendor\ffmpeg
          JS_RUNTIME_DIR: ${{ github.workspace }}\service\vendor\js
        run: service/.venv/Scripts/python.exe -m inferno_service --check

      # Runs build:service (PyInstaller, which self-verifies by starting the
      # frozen exe and polling /health) and then tauri build. Tauri's
      # beforeBuildCommand is `npm run build` - the desktop target - so the
      # installer gets the desktop frontend, window controls and all.
      - name: Build the installer
        run: npm run tauri:build

      - name: List what was produced
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse `
            -Include *.exe, *.msi |
            ForEach-Object {
              Write-Host "$($_.FullName)  $([math]::Round($_.Length/1MB,1)) MB"
            }

      - uses: actions/upload-artifact@v4
        with:
          name: inferno-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Anything with a pre-release suffix stays marked as one. Alphas
          # should not show as the latest release on the repo front page.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          body: |
            ## Inferno ${{ github.ref_name }}

            ### Desktop (Windows)

            Download the `.exe` below and run it. The installer is **unsigned**,
            so SmartScreen will warn - More info, then Run anyway.

            ### Server (Docker)

            ```bash
            docker run -d -p 127.0.0.1:8765:8765 -v inferno-data:/data \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            For Portainer, add a stack from this repository pointing at
            `docker/portainer-stack.yml`. See
            [docker/README.md](https://github.com/${{ github.repository }}/blob/master/docker/README.md).

            **The server image ships with no authentication** and binds to
            loopback for that reason. Put a reverse proxy with auth in front
            before exposing it. Cloud storage providers are not implemented
            yet - downloads land on the `/data` volume.
