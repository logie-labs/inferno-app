[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
thiserror = "2"
getrandom = "0.3"
# `bundled` compiles SQLite from source rather than trusting whatever the
# machine happens to have, so the installer is self-contained.
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tauri-plugin-dialog = "2"

# Job objects: the only reliable way to guarantee the service child dies with
# the app on Windows, including on a hard kill. See addons/inferno_service.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  # ShellExecuteW: the real "open this the way the shell would" API.
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
