[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferno-service"
version = "1.0.0"
description = "Inferno's service layer: yt-dlp behind an HTTP + WebSocket API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2024.1.1",
    # Not optional in practice. yt-dlp treats mutagen as the primary way to
    # write cover art, and without it an m4a thumbnail falls back to an ffmpeg
    # remux whose `-disposition` index is computed before `-dn` drops the
    # chapter stream - so embedding a thumbnail *and* chapters into the same
    # m4a fails outright. For ogg/opus/flac it does not even have a fallback.
    "mutagen>=1.47",
    "pydantic>=2.7",
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "anyio>=4",
]

[project.scripts]
inferno-service = "inferno_service.__main__:main"
inferno-cli = "inferno_service.clients.cli:main"

[tool.setuptools.packages.find]
include = ["inferno_service*"]

[tool.setuptools.package-data]
inferno_service = ["clients/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live: hits the real network and real binaries; opt in with INFERNO_LIVE=1",
]
